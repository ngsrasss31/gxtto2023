name: Windows VDS Oluşturma (Free Tier)

on:
  workflow_dispatch:

jobs:
  vds-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Repo'yu Klonla
      uses: actions/checkout@v3

    - name: AWS Kimlik Bilgilerini Ayarla
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Rastgele Şifre Oluştur
      id: pwgen
      run: |
        $pass = [System.Web.Security.Membership]::GeneratePassword(20,3)
        echo "password=$pass" >> $env:GITHUB_OUTPUT

    - name: EC2 Oluştur (t2.micro - Ücretsiz)
      run: ./scripts/create-vds.ps1 -InstanceType "t2.micro" -Password "${{ steps.pwgen.outputs.password }}"

    - name: 2 dakika bekle (Yapılandırma ve RDP açılması için)
      run: Start-Sleep -Seconds 120

    - name: Selenium Testlerini Çalıştır
      run: echo "Buraya test scriptini bağlayabilirsiniz veya SSH ile VDS'e bağlanıp tetikleyebilirsiniz."

    - name: EC2'yi Sil
      run: ./scripts/terminate-vds.ps1
